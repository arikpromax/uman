<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<!-- Стара адреса сторінки меню. Сама сторінка лежить у /menu/,
     а це лишається, щоб збережені посилання не вели в 404. -->
<link rel="canonical" href="https://fujisushi.com.ua/menu/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/menu/">
<title>Меню — Fuji Sushi, Умань</title>
</head>
<body>
<p>Меню тут: <a href="/menu/">fujisushi.com.ua/menu/</a></p>
<script>location.replace('/menu/' + location.search + location.hash);</script>
</body>
</html>
