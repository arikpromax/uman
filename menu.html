<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Меню — Fuji Sushi, Умань</title>
<meta name="description" content="Меню Fuji Sushi: сети, Філадельфія, запечені, темпура, суші та вок. Доставка по Умані, безкоштовно від 499 ₴.">
<meta name="theme-color" content="#000000">
<meta property="og:image" content="logo.jpg">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* без відʼємних полів: вони давали зайву ширину і сторінку можна було тягнути вбік */
  .catbar{position:sticky;top:74px;z-index:40;margin:14px 0 0;
    background:linear-gradient(#000 72%,rgba(0,0,0,0))}
  .cats--pill{padding:10px 0 12px}
  .cats--pill .cat{flex-direction:row;min-width:0;padding:10px 16px;gap:9px;font-size:14px}
  .cats--pill .cat svg,.cats--pill .cat .pic{width:24px;height:24px}
  .grp{padding-top:12px}
  .grp h2{font-size:clamp(19px,2.4vw,24px);font-weight:600;padding:26px 0 14px}
</style>
</head>
<body>

<div class="glows" aria-hidden="true">
  <span class="glow glow-1"></span><span class="glow glow-2"></span><span class="glow glow-3"></span>
</div>

<header class="header" id="hdr"></header>

<main class="page wrap">
  <h1 class="h1">Меню</h1>

  <div class="searchbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4 4"/></svg>
      <input id="q" type="search" placeholder="Пошук по меню" autocomplete="off">
      <button id="qx" type="button" aria-label="Очистити" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </label>
    <span id="filtSlot"></span>
  </div>

  <div class="catbar"><div class="cats cats--pill" id="cats"></div></div>

  <div id="list"></div>

  <footer class="footer" id="ftr"></footer>
</main>

<nav class="navbar" id="nav"></nav>
<div id="cartWrap"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
mountShell('menu');
$('#ftr').innerHTML = footerHTML();

const par = new URLSearchParams(location.search);
let cat = par.get('c') || 'all';
let q   = par.get('q') || '';
$('#q').value = q;
$('#qx').hidden = !q;

$('#filtSlot').outerHTML = sortBtnHTML();
wireSort(render);

/* кирилиця ↔ латиниця: щоб «filadelfiya» знаходило «Філадельфію» */
const FOLD = {а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',є:'ye',ж:'zh',з:'z',и:'y',і:'i',ї:'yi',й:'y',
  к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ь:'',ю:'yu',я:'ya',ʼ:'',"'":''};
const fold = s => s.toLowerCase().split('').map(ch=>FOLD[ch]??ch).join('');

function render(){
  const nq = fold(q.trim());
  const hit = m => {
    if(nq){
      const hay = fold(m.n+' '+(m.d||'')+' '+(m.list||[]).join(' ')+' '+(m.ing||[]).map(k=>(ING[k]||{}).n).join(' '));
      if(!hay.includes(nq)) return false;
    }
    return nq ? true : (cat==='all' || m.c===cat);
  };
  const found = applySort(ITEMS.filter(hit));

  $$('#cats .cat').forEach(a=>a.classList.toggle('on', !nq && a.dataset.c===cat));

  if(!found.length){
    $('#list').innerHTML = `<div class="empty">Нічого не знайшлося. Спробуйте іншу назву або <a href="menu.html" style="color:var(--red-hi)">усе меню</a>.</div>`;
    return;
  }
  // при пошуку або зміненому сортуванні показуємо єдиним списком
  if(nq || sortI!==0){
    $('#list').innerHTML = `<div class="grp"><h2>${nq?'Знайдено':SORTS[sortI].n}: ${found.length}</h2><div class="grid">${found.map(cardHTML).join('')}</div></div>`;
    return;
  }
  const groups = cat==='all' ? CATS : CATS.filter(c=>c.id===cat);
  $('#list').innerHTML = groups.map(c=>{
    const its = found.filter(i=>i.c===c.id);
    if(!its.length) return '';
    return `<section class="grp" id="c-${c.id}"><h2>${c.n}</h2><div class="grid">${its.map(cardHTML).join('')}</div></section>`;
  }).join('');
}

function renderCats(){
  $('#cats').innerHTML = [{id:'all',n:'Усі'},...CATS].map(c=>
    `<button class="cat" data-c="${c.id}">${
      c.id==='all' ? art({t:'set',ing:['losos','krev','avo'],n:'Усі'},40) : catIcon(c)
    }${c.n}</button>`).join('');
}
renderCats();

$('#cats').addEventListener('click',e=>{
  const b=e.target.closest('.cat'); if(!b) return;
  cat=b.dataset.c; q=''; $('#q').value=''; $('#qx').hidden=true;
  history.replaceState(null,'', cat==='all'?'menu.html':'menu.html?c='+cat);
  render(); window.scrollTo({top:$('.catbar').offsetTop-70,behavior:'smooth'});
});

let qt;
$('#q').addEventListener('input',e=>{
  q=e.target.value; $('#qx').hidden=!q;
  clearTimeout(qt); qt=setTimeout(render,180);
});
$('#qx').onclick=()=>{ q=''; $('#q').value=''; $('#qx').hidden=true; render(); };

render();
if(cat!=='all' && !q) setTimeout(()=>window.scrollTo({top:$('.catbar').offsetTop-70,behavior:'instant'}),0);

/* db.js викликає це після завантаження меню з адмінки */
window.rerender = () => { renderCats(); render(); };
</script>
<script src="fx.js"></script>
<script src="db.js"></script>
</body>
</html>
